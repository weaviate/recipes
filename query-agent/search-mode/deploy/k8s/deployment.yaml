apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-mode-server
  labels:
    app: search-mode-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-mode-server
  template:
    metadata:
      labels:
        app: search-mode-server
    spec:
      containers:
        - name: server
          # Replace with your registry, e.g. ghcr.io/<org>/search-mode-server:0.1.0
          image: search-mode-server:0.1.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: weaviate-credentials
          env:
            - name: QUERY_AGENT_COLLECTIONS
              value: "Products"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
